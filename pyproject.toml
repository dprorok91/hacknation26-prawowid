[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "prawdowid"
version = "0.0.1"
description = "Polish news evidence and narrative comparison starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pgvector>=0.4,<1",
  "httpx>=0.27,<1",
  "feedparser>=6.0,<7",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.0,<7",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.3,<6", "ollama>=0.4,<1"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/prawdowid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
